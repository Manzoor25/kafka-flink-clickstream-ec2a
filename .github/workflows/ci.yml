name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-minicluster-tests:
    name: Flink SQL/DataStream MiniCluster & Python Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt

      - name: Validate Docker Compose specification
        run: docker compose config -q

      - name: Build shaded Flink JAR and run JUnit 5 MiniCluster SQL & DataStream tests
        run: mvn -B -f flink/pom.xml test package

      - name: Install Python dependencies and run generator & batch-recount unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt
          pytest -v generator/tests

  e2e-compose-smoke:
    name: Live 10-Container Stack Smoke & Batch Recount Check
    runs-on: ubuntu-latest
    needs: unit-and-minicluster-tests
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Boot 3-broker Kafka 4.4 KRaft, Flink 2.2, ClickHouse 26.8, Karapace, MinIO & Grafana
        run: make up

      - name: Run realistic e-commerce clickstream + flash-sale temporal price demo
        env:
          DEMO_DURATION_SEC: "25"
          DEMO_EPS: "180"
        run: make demo

      - name: Verify strict streaming-vs-batch recount (0 missing / 0 extra) & end-to-end Grafana freshness
        run: |
          make test-smoke
          curl -fsS http://localhost:3000/api/health

      - name: Dump container diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=120 flink-jobmanager flink-taskmanager-1 flink-taskmanager-2 clickhouse schema-registry

      - name: Tear down stack and clean volumes
        if: always()
        run: make down
